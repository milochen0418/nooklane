[tool.poetry]
name = "nooklane"
version = "0.1.0"
description = "A self-hosted 2D virtual place: walk up to people to talk, and their voices and cameras get clearer as you get close (proximity chat on an embedded open-source LiveKit server), for *.reflex-ddns.com"
authors = ["Milo Chen"]
license = "MIT"
readme = "README.md"
packages = [{include = "nooklane"}]

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
# <3.16 cap: verified up to 3.15.
python = ">=3.11,<3.16"
reflex = "0.10.0"
livekit-api = "^1.0"
aiohttp = "^3.9"
httpx = "*"
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
playwright = "^1.42.0"
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
